name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Test
        run: go test ./...

      - name: Build release binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/easynode-linux-amd64 ./cmd/easynode
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/easynode-linux-arm64 ./cmd/easynode
          (cd dist && sha256sum easynode-linux-* > checksums.txt)

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/easynode-linux-amd64
            dist/easynode-linux-arm64
            dist/checksums.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: easynode-linux
          path: dist/*
